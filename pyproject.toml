[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backsight"
version = "0.1.0.dev0"
description = "Test how AI agents behave when their tools fail, and replay any failure exactly from one seed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
backsight = "backsight.cli:main"

[tool.setuptools]
packages = ["backsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
